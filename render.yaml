# Render Blueprint — deploy the Tirvona backend API + frontend SPA.
# In Render: New → Blueprint → point at this repo. Render reads this file and
# creates both services. Secrets marked `sync: false` are prompted for in the
# dashboard (never stored in git).
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API + Socket.io (persistent server, so real-time works) ─────────
  - type: web
    name: tirvona-api
    runtime: node
    plan: free
    rootDir: Newbackend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the app reads process.env.PORT.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: tirvona
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: JWT_ISSUER
        value: tirvona-api
      - key: JWT_AUDIENCE
        value: tirvona-clients
      # Set to the frontend's public URL once it is deployed (comma-separated).
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: true
      - key: SWAGGER_ENABLED
        value: false
      - key: PARKING_QR_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OTP_SMS_ENABLED
        value: false
      - key: OTP_LENGTH
        value: 6
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 30
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDER_ID
        value: TRVONA
      - key: MSG91_ROUTE
        value: 4
      - key: MSG91_COUNTRY_CODE
        value: 91
      # Transactional email (OTP, password reset, notifications, messages).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EMAIL_FROM_NAME
        value: Tirvona
      # Must be on a domain verified in the Resend dashboard.
      - key: EMAIL_FROM_EMAIL
        sync: false
      - key: EMAIL_REPLY_TO
        value: support@tirvona.com
      # ── Smart Contact QR ────────────────────────────────────────────────
      # Its own database, so the module can later move to its own cluster
      # without a migration. Leave the URI unset to reuse the platform
      # cluster; the dbName below still keeps the collections separate.
      - key: SMART_CONTACT_MONGODB_URI
        sync: false
      - key: SMART_CONTACT_MONGODB_DB_NAME
        value: tirvona_smart_contact
      # The origin printed QR codes encode. Deliberately NOT derived from
      # CLIENT_URL: this value is baked into physical visiting cards and can
      # never change afterwards, so moving the marketing site must not be able
      # to invalidate artwork already in circulation.
      - key: SMART_CONTACT_PUBLIC_BASE_URL
        value: https://www.tirvona.com
      - key: SMART_CONTACT_PUBLIC_PATH_PREFIX
        value: c
      # Origin the console builds QR/vCard download links against.
      - key: SMART_CONTACT_API_BASE_URL
        sync: false
      - key: SMART_CONTACT_INACTIVE_EMAIL
        value: partners@tirvona.com
      # Optional QR branding. The logo is embedded in SVG output only.
      - key: SMART_CONTACT_QR_LOGO_URL
        sync: false
      # Salts the per-visitor analytics hash. Set it to something random and
      # long — reusing JWT_SECRET is the fallback, not the intent.
      - key: SMART_CONTACT_SESSION_SALT
        sync: false

  # ── Frontend SPA (static site) ──────────────────────────────────────────────
  - type: web
    name: tirvona-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA fallback so client-side routes resolve to index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point the SPA at the deployed API (e.g. https://tirvona-api.onrender.com).
      - key: VITE_API_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  # ── Smart Contact public page (static site) ─────────────────────────────────
  # The page a scanned QR opens. A separate build from the main SPA because it
  # is a single, dependency-light public route held to a two-second budget.
  #
  # IMPORTANT: printed QR codes encode https://www.tirvona.com/c/{slug}, so
  # this build has to be reachable at that path. Render serves it on its own
  # host, which means /c/* on the tirvona.com host must be routed here (a CDN
  # or reverse-proxy rule). Until that rule exists, point
  # SMART_CONTACT_PUBLIC_BASE_URL at this service's own URL so generated QR
  # codes stay correct — see SmarID/README.md, "Deployment".
  - type: web
    name: tirvona-smart-contact
    runtime: static
    rootDir: SmarID
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
