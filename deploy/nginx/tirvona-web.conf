# Tirvona web host — URL routing for www.tirvona.com
#
# WHY THIS FILE EXISTS
#
# Smart Contact profiles are served from the site root: a printed QR encodes
# `https://www.tirvona.com/c/{slug}` and that URL is permanent. To a static
# host `/ravindr-bhardwaj` and `/parking` are indistinguishable, so the only
# way to tell a profile from an SPA page is an explicit list of the SPA's own
# top-level segments, with the Smart Contact page as the fallback for anything
# not on it.
#
# Vercel and Render each expressed that list in their own config
# (frontend/vercel.json, render.yaml). Neither is read by nginx. When
# production moved to this VPS those rewrites were left behind, so `/c/{slug}`
# fell through to the SPA's index.html and every scanned QR rendered the
# homepage instead of the identity card.
#
# KEEPING IT IN SYNC
#
# The segment list below must match the alternation group in
# frontend/vercel.json. `npm run check:routes` (which runs as part of
# `npm run build`) fails the build if this file, vercel.json and App.tsx
# disagree — add a top-level route to the SPA and you must add it here too, or
# the new page will silently serve "Contact not found" in production.
#
# APPLYING IT
#
#   sudo cp deploy/nginx/tirvona-web.conf /etc/nginx/snippets/tirvona-web.conf
#   # then, inside the server block for www.tirvona.com:
#   #     include /etc/nginx/snippets/tirvona-web.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is a snippet of `location` blocks on purpose — it is meant to be
# included into the existing server block rather than replace it, so the TLS
# certificate, the api.tirvona.com proxy and anything else already configured
# on this host are left untouched.

root /var/www/tirvona/frontend/dist;
index index.html;

# ── 1. The site root ────────────────────────────────────────────────────────
# An exact match, which nginx resolves before every other location, so "/" can
# never be mistaken for an empty profile slug.
location = / {
    try_files /index.html =404;
}

# ── 2. Legacy QR path ───────────────────────────────────────────────────────
# QR codes generated while profiles lived under /c/ are already printed and
# cannot be reissued, so this path has to keep answering. `^~` outranks the
# regex block below, so a slug like /c/blog-writer is never mistaken for the
# SPA's /blog page.
location ^~ /c/ {
    try_files $uri /smart-contact.html;
}

# ── 3. The SPA's own pages ──────────────────────────────────────────────────
# Mirrors the alternation group in frontend/vercel.json. Matched as a regex so
# both /parking and /parking/anything/deeper reach the SPA.
location ~ ^/(about|admin|ashram|ashram-admin|ashram-owner|blog|booking|books|cancellation-policy|careers|circuits|contact|cookie-policy|dashboard|destinations|events|faq|featured-banner|govt-guidelines|handicrafts|help|local|local-guides|login|marketplace|offers|owner|owner-guide|parking|partner|pilgrimage-circuits|press|privacy|profile|public|puja-items|refund-policy|register|religious-products|reset-password|restaurants|search|services|shops|staff|stay-policies|support|temples|terms|transport|travel-guides|video|volunteer)(/|$) {
    try_files $uri /index.html;
}

# ── 4. Build output ─────────────────────────────────────────────────────────
# Hashed filenames, so they are immutable and safe to cache for a year. Two
# directories because the Smart Contact page is a second Vite build copied in
# beside the SPA; it emits to sc-assets/ precisely so the two never merge.
location ~ ^/(assets|sc-assets)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# ── 5. Everything else is a profile slug ────────────────────────────────────
# `try_files $uri` first so real files (logo.png, robots.txt, favicons) are
# still served from disk before the fallback applies.
location / {
    try_files $uri $uri/ /smart-contact.html;
}
