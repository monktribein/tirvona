# Tirvona web host — URL routing for www.tirvona.com
#
# WHY THIS FILE EXISTS
#
# Smart Contact profiles are served from the site root: a printed QR encodes
# `https://www.tirvona.com/c/{slug}` and that URL is permanent. To a static
# host `/ravindr-bhardwaj` and `/parking` are indistinguishable, so the only
# way to tell a profile from an SPA page is an explicit list of the SPA's own
# top-level segments, with the Smart Contact page as the fallback for anything
# not on it.
#
# Vercel and Render each expressed that list in their own config
# (frontend/vercel.json, render.yaml). Neither is read by nginx. When
# production moved to this VPS those rewrites were left behind, so `/c/{slug}`
# fell through to the SPA's index.html and every scanned QR rendered the
# homepage instead of the identity card.
#
# KEEPING IT IN SYNC
#
# The segment list below must match the alternation group in
# frontend/vercel.json. `npm run check:routes` (which runs as part of
# `npm run build`) fails the build if this file, vercel.json and App.tsx
# disagree — add a top-level route to the SPA and you must add it here too, or
# the new page will silently serve "Contact not found" in production.
#
# APPLYING IT
#
#   sudo cp deploy/nginx/tirvona-web.conf /etc/nginx/snippets/tirvona-web.conf
#   # then, inside the server block for www.tirvona.com:
#   #     include /etc/nginx/snippets/tirvona-web.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is a snippet of `location` blocks on purpose — it is meant to be
# included into the existing server block rather than replace it, so the TLS
# certificate, the api.tirvona.com proxy and anything else already configured
# on this host are left untouched.

root /var/www/tirvona/frontend/dist;
index index.html;

# ── Canonical Host Guard ───────────────────────────────────────────────────
# If non-WWW tirvona.com reaches this server block, issue an immediate 301
# redirect to canonical https://www.tirvona.com preserving exact path & query.
if ($host = "tirvona.com") {
    return 301 https://www.tirvona.com$request_uri;
}

# ── 1. The site root ────────────────────────────────────────────────────────
# An exact match, which nginx resolves before every other location, so "/" can
# never be mistaken for an empty profile slug.
location = / {
    try_files /index.html =404;
}

# ── 1b. Search engine & crawler assets ──────────────────────────────────────
# Explicit exact locations ensure robots.txt and sitemap.xml can NEVER fall
# through to /smart-contact.html. They serve the static file if built, or proxy
# directly to the Node backend if the static file is missing.
location = /robots.txt {
    default_type "text/plain; charset=utf-8";
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
    try_files /robots.txt @backend_robots;
}

location @backend_robots {
    proxy_pass http://127.0.0.1:5000/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /sitemap.xml {
    default_type "application/xml; charset=utf-8";
    add_header Content-Type "application/xml; charset=utf-8" always;
    add_header Cache-Control "public, max-age=3600" always;
    try_files /sitemap.xml @backend_sitemap;
}

location @backend_sitemap {
    proxy_pass http://127.0.0.1:5000/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /favicon.ico {
    try_files /favicon.ico =404;
}

# ── 2. Legacy QR path ───────────────────────────────────────────────────────
# QR codes generated while profiles lived under /c/ are already printed and
# cannot be reissued, so this path has to keep answering. `^~` outranks the
# regex block below, so a slug like /c/blog-writer is never mistaken for the
# SPA's /blog page.
location ^~ /c/ {
    try_files $uri /smart-contact.html;
}

# ── 2b. Legacy id-based URLs ────────────────────────────────────────────────
# Pages used to live at /ashram/<mongo id>. Those URLs are indexed, so they
# must keep working AND pass their ranking to the new slug URL — which needs a
# real 301, something the SPA cannot issue. This proxies them to the API, which
# looks the entity up and answers 301 (or 404 when it genuinely does not
# exist). Placed above the SPA block because nginx takes the first regex match.
#
# `ashrams` (plural) is deliberately absent here: that is the new canonical
# form and must reach the SPA normally.
# The pattern is quoted because nginx treats { and } as block delimiters,
# so an unquoted {24} makes it read "24}(/|$)" as an unknown directive.
location ~ "^/(ashram|aarti|pooja|booking|parking|marketplace/product)/[0-9a-fA-F]{24}(/|$)" {
    proxy_pass http://127.0.0.1:5000/url/resolve$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── 3. The SPA's own pages ──────────────────────────────────────────────────
# Mirrors the alternation group in frontend/vercel.json. Matched as a regex so
# both /parking and /parking/anything/deeper reach the SPA.
location ~ ^/(aarti|about|admin|ashram|ashrams|ashram-admin|ashram-owner|blog|booking|books|budget-stays-in-vrindavan|cancellation-policy|careers|circuits|contact|cookie-policy|dashboard|destination|destinations|events|family-stays-in-vrindavan|faq|featured-banner|govt-guidelines|handicrafts|help|live-pooja|local|local-guides|login|marketplace|offers|owner|owner-guide|parking|partner|pilgrimage-circuits|pooja|press|privacy|profile|provider|public|puja-items|refund-policy|register|religious-products|reset-password|restaurants|search|services|shops|staff|stay|stay-admin|stay-owner|stay-policies|stays|stays-in-vrindavan|Stays-near-prem-mandir-vrindavan|stays-near-prem-mandir-vrindavan|stays-near-banke-bihari-vrindavan|stays-near-iskcon-vrindavan|support|temples|temple-owner|terms|transport|travel-guides|video|volunteer)(/|$) {
    try_files $uri /index.html;
}

# ── 4. Build output ─────────────────────────────────────────────────────────
# Hashed filenames, so they are immutable and safe to cache for a year. Two
# directories because the Smart Contact page is a second Vite build copied in
# beside the SPA; it emits to sc-assets/ precisely so the two never merge.
location ~ ^/(assets|sc-assets)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# ── 5. Everything else is a profile slug ────────────────────────────────────
# `try_files $uri` first so real files (logo.png, robots.txt, favicons) are
# still served from disk before the fallback applies.
location / {
    try_files $uri $uri/ /smart-contact.html;
}
