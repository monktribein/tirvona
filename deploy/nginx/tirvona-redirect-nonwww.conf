# Tirvona Non-WWW to WWW 301 Canonical Domain Redirect
#
# CANONICAL DOMAIN POLICY:
# The ONLY canonical production domain is https://www.tirvona.com.
# Every request to tirvona.com (HTTP or HTTPS) must permanently (HTTP 301)
# redirect to https://www.tirvona.com with all path segments, route slugs,
# and query parameters preserved. Requests to www.tirvona.com must never redirect.
#
# ==============================================================================
# NGINX CONFIGURATION
# Place this in /etc/nginx/conf.d/tirvona-redirect-nonwww.conf
# or in /etc/nginx/sites-available/tirvona
# ==============================================================================

# --- 1. HTTP Redirect Block: All HTTP -> Canonical HTTPS WWW ---
server {
    listen 80;
    listen [::]:80;
    server_name tirvona.com www.tirvona.com;

    return 301 https://www.tirvona.com$request_uri;
}

# --- 2. HTTPS Non-WWW Redirect Block: tirvona.com -> www.tirvona.com ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tirvona.com;

    # SSL Certificate for tirvona.com (or SAN certificate covering both)
    ssl_certificate /etc/letsencrypt/live/tirvona.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tirvona.com/privkey.pem;

    # Permanent 301 redirect preserving exact path, slug, and query parameters
    return 301 https://www.tirvona.com$request_uri;
}

# ==============================================================================
# CANONICAL WWW SERVER BLOCK REFERENCE:
# In your main HTTPS server block for www.tirvona.com:
#
