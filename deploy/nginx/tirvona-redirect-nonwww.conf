# Tirvona Non-WWW to WWW 301 Canonical Redirect Snippet
#
# WHY THIS FILE EXISTS
#
# Canonical domain policy: https://www.tirvona.com is the ONLY canonical domain.
# Every request to tirvona.com (both HTTP and HTTPS) must permanently (301)
# redirect to https://www.tirvona.com with all path segments and query arguments preserved.
#
# APPLYING IT IN NGINX
#
# 1. Copy snippet:
#    sudo cp deploy/nginx/tirvona-redirect-nonwww.conf /etc/nginx/snippets/tirvona-redirect-nonwww.conf
#
# 2. In /etc/nginx/sites-available/tirvona (or your main nginx configuration):
#
#    # --- HTTP: Redirect all HTTP (both www and non-www) to canonical HTTPS WWW ---
#    server {
#        listen 80;
#        listen [::]:80;
#        server_name tirvona.com www.tirvona.com;
#        return 301 https://www.tirvona.com$request_uri;
#    }
#
#    # --- HTTPS: Non-WWW to WWW 301 Redirect ---
#    server {
#        listen 443 ssl http2;
#        listen [::]:443 ssl http2;
#        server_name tirvona.com;
#
#        ssl_certificate /etc/letsencrypt/live/tirvona.com/fullchain.pem; # (or your cert path)
#        ssl_certificate_key /etc/letsencrypt/live/tirvona.com/privkey.pem;
#
#        return 301 https://www.tirvona.com$request_uri;
#    }
#
#    # --- HTTPS: Canonical WWW Server Block ---
#    server {
#        listen 443 ssl http2;
#        listen [::]:443 ssl http2;
#        server_name www.tirvona.com;
#
#        ssl_certificate /etc/letsencrypt/live/www.tirvona.com/fullchain.pem; # (or SAN cert)
#        ssl_certificate_key /etc/letsencrypt/live/www.tirvona.com/privkey.pem;
#
#        include /etc/nginx/snippets/tirvona-web.conf;
#    }
#
# 3. Reload Nginx:
#    sudo nginx -t && sudo systemctl reload nginx
