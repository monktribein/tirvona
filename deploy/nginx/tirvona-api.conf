# Tirvona API host — request limits for api.tirvona.com
#
# WHY THIS FILE EXISTS
#
# nginx caps a request body at 1 MB by default. The API accepts images up to
# 10 MB and video up to 100 MB (UploadsService.SIZE_LIMITS / MAX_UPLOAD_BYTES),
# so every upload over 1 MB was rejected by nginx with a 413 before it ever
# reached Node. Locally there is no nginx in front of the API, which is exactly
# why uploads worked in development and failed in production.
#
# Verified against production before this file was written:
#
#     0.5 MB body -> HTTP 401   (reached the app, rejected for auth)
#     2.0 MB body -> HTTP 413   (nginx/1.24.0, never reached the app)
#
# The 413 also surfaced to the browser as a bare "Network Error": nginx serves
# its own HTML error page, and that page carries none of the CORS headers the
# app sets, so the browser refuses to let JavaScript read the response and
# reports a transport failure instead of the real reason.
#
# KEEPING IT IN SYNC
#
# client_max_body_size must stay >= UploadsService.MAX_UPLOAD_BYTES in
# Newbackend/src/modules/uploads/application/uploads.service.ts. The app then
# enforces the real per-type limit (10 MB for an image) and returns a readable
# JSON error — which is where that rejection belongs, because only the app can
# answer it with CORS headers attached.
#
# APPLYING IT
#
#   sudo cp deploy/nginx/tirvona-api.conf /etc/nginx/snippets/tirvona-api.conf
#   # then, inside the server block for api.tirvona.com:
#   #     include /etc/nginx/snippets/tirvona-api.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# A snippet of directives rather than a whole server block, so the TLS
# certificate and the proxy_pass already configured on this host are untouched.

# The ceiling nginx will accept. Matches the app's own hard maximum so that
# every rejection past this point comes from the app, as a readable JSON error
# rather than an opaque HTML 413.
client_max_body_size 100m;

# A 100 MB upload on a slow connection needs longer than the 60s default to
# finish sending, and Cloudinary needs longer than that to accept it.
client_body_timeout 300s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Stream the body through instead of spooling the whole of it to disk first.
# Uploads are held in memory by multer and forwarded to Cloudinary, so buffering
# a second copy on the filesystem only adds latency.
proxy_request_buffering off;
