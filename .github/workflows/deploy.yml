name: Deploy Tirvona

# Production deploys only what CI has passed: this runs when "Tirvona CI" finishes for a push to
# main, and only if every CI job succeeded. A red CI run never reaches the VPS.
on:
  workflow_run:
    workflows: ["Tirvona CI"]
    types: [completed]
    branches: [main]

# One deploy at a time; a deploy that is running is never cancelled halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          # The exact commit CI tested.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_SHA
          script: |
            set -e

            echo "================================"
            echo "Starting Tirvona deployment of ${DEPLOY_SHA}"
            echo "================================"

            cd /var/www/tirvona

            echo "=== Ensuring directory permissions ==="
            if sudo -n true 2>/dev/null; then
              echo "Passwordless sudo is available. Ensuring directory permissions..."
              sudo chown -R $(whoami):$(whoami) /var/www/tirvona
              sudo chmod -R u+rwX,go+rX /var/www/tirvona
              sudo chown -R $(whoami):$(whoami) ~/.npm 2>/dev/null || true
            else
              echo "Passwordless sudo not configured for $(whoami). Proceeding with standard user permissions."
            fi

            echo "=== Updating repository ==="
            git fetch origin
            # CI runs can finish out of order. Deploy only while this commit is still the tip of
            # main, so an older run can never replace a newer release; the newer commit's own CI
            # run deploys it.
            if [ -z "$DEPLOY_SHA" ] || [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "main has moved past ${DEPLOY_SHA:-<none>}; skipping. The newest commit deploys after its CI passes."
              exit 0
            fi
            git checkout main
            git reset --hard "$DEPLOY_SHA"

            echo "=== Backend ==="
            cd /var/www/tirvona/Newbackend
            if [ -d "node_modules" ]; then
              if ! rm -rf node_modules/.bin 2>/dev/null; then
                echo "Notice: node_modules contains protected files. Moving aside for clean install..."
                mv node_modules node_modules_old_$(date +%s) || true
              fi
            fi
            npm ci
            # The compiled API lives in the deploy user's home, not in the
            # repo: a dist-vps left owned by root (a manual `sudo` build)
            # cannot be overwritten without sudo. Build into a fresh directory
            # and swap it in, so a failed build leaves the running one intact.
            # node_modules is linked in so the build resolves its packages;
            # .env is still read from the --cwd given to pm2 below.
            API_BUILD_ROOT="$HOME/tirvona-build"
            mkdir -p "$API_BUILD_ROOT"
            ln -sfn /var/www/tirvona/Newbackend/node_modules "$API_BUILD_ROOT/node_modules"
            rm -rf "$API_BUILD_ROOT/api-next"
            npx tsc -p tsconfig.build.json --outDir "$API_BUILD_ROOT/api-next"
            mkdir -p "$API_BUILD_ROOT/api-next/modules/smart-contact/assets"
            cp -R src/modules/smart-contact/assets/* "$API_BUILD_ROOT/api-next/modules/smart-contact/assets/" || true

            # The API refuses to start against a schema that does not match its
            # models, so new tables/columns must exist before it restarts.
            # Migrations are additive only (never alter or drop), so the API
            # still running keeps working against the new schema, and the previous
            # build can still start after them if it has to be restored. Any failure
            # stops the deploy here, before the running API is replaced.
            echo "=== Database migrations ==="
            npm run db:migrate
            npm run db:verify

            echo "=== Frontend ==="
            cd /var/www/tirvona/frontend
            if [ -d "node_modules" ]; then
              if ! rm -rf node_modules/.bin 2>/dev/null; then
                echo "Notice: frontend node_modules contains protected files. Moving aside for clean install..."
                mv node_modules node_modules_old_$(date +%s) || true
              fi
            fi
            npm ci
            # nginx serves dist/. Build into dist-next (vite.config.ts and
            # build-smart-contact.mjs read TIRVONA_DIST_DIR) and swap it in only
            # once complete, so the site never serves a half-built or empty dist,
            # and a failed build leaves the live site untouched. dist-prev keeps
            # the previous release for a quick manual rollback.
            if [ -d "dist-next" ] && ! rm -rf dist-next 2>/dev/null; then
              mv dist-next dist-next_old_$(date +%s)
            fi
            TIRVONA_DIST_DIR=dist-next npm run build
            if [ -d "dist-prev" ] && ! rm -rf dist-prev 2>/dev/null; then
              echo "Notice: frontend dist-prev contains protected files. Moving aside..."
              mv dist-prev dist_old_$(date +%s)
            fi
            if [ -d "dist" ]; then mv dist dist-prev; fi
            mv dist-next dist
            if sudo -n true 2>/dev/null; then
              sudo chmod -R go+rX /var/www/tirvona/frontend/dist 2>/dev/null || true
            fi

            echo "=== Restarting API ==="
            # Keep the running build as api-prev, so it can be restored if the new one
            # does not come up.
            rm -rf "$API_BUILD_ROOT/api-prev"
            if [ -d "$API_BUILD_ROOT/api" ]; then mv "$API_BUILD_ROOT/api" "$API_BUILD_ROOT/api-prev"; fi
            mv "$API_BUILD_ROOT/api-next" "$API_BUILD_ROOT/api"

            start_api() {
              pm2 delete tirvona-api || true
              pm2 start "$API_BUILD_ROOT/api/main.js" --name tirvona-api --cwd /var/www/tirvona/Newbackend --update-env
            }
            # Liveness of the process itself (local, no nginx, no Redis dependency).
            api_alive() {
              for i in $(seq 1 12); do
                if curl -fsS http://127.0.0.1:5000/api/health/live >/dev/null; then return 0; fi
                echo "API not up yet. Attempt $i/12. Waiting 5 seconds..."
                sleep 5
              done
              return 1
            }

            start_api
            if api_alive; then
              echo "=== New API is up ==="
              pm2 logs tirvona-api --lines 80 --nostream
            else
              echo "=== New API did not start; restoring the previous build ==="
              pm2 logs tirvona-api --lines 120 --nostream || true
              if [ -d "$API_BUILD_ROOT/api-prev" ]; then
                rm -rf "$API_BUILD_ROOT/api-failed"
                mv "$API_BUILD_ROOT/api" "$API_BUILD_ROOT/api-failed"
                mv "$API_BUILD_ROOT/api-prev" "$API_BUILD_ROOT/api"
                start_api
                if api_alive; then
                  echo "=== Previous API restored and running. The failed build is in $API_BUILD_ROOT/api-failed ==="
                else
                  echo "=== The previous API did not start either: manual action needed ==="
                fi
              fi
              exit 1
            fi

            NGINX_SNIPPETS="tirvona-web.conf tirvona-redirect-nonwww.conf tirvona-api.conf"
            restore_nginx() {
              for f in $NGINX_SNIPPETS; do
                if [ -f "/etc/nginx/snippets/$f.bak-deploy" ]; then
                  sudo cp -p "/etc/nginx/snippets/$f.bak-deploy" "/etc/nginx/snippets/$f"
                else
                  sudo rm -f "/etc/nginx/snippets/$f"
                fi
              done
            }

            echo "=== Installing Nginx routing ==="
            if sudo -n true 2>/dev/null; then
              # Smart Contact profiles live at /c/{slug} and /{slug} on the main
              # host. Vercel and Render expressed that routing in their own
              # config; nginx reads neither, so moving to this VPS silently sent
              # every scanned QR to the SPA and rendered the homepage. The rules
              # now ship with the repo and are installed on each deploy:
              #   tirvona-web.conf             www.tirvona.com routing + server-rendered SEO
              #   tirvona-redirect-nonwww.conf canonical non-WWW to WWW 301 redirect
              #   tirvona-api.conf             raises the request-body cap on api.tirvona.com.
              #     nginx defaults to 1 MB, while the API accepts 10 MB images and 100 MB
              #     video, so every upload over 1 MB was rejected with a 413 before reaching
              #     Node — which is why uploads worked locally and failed here.
              # The installed copies are backed up first, so a config that fails
              # `nginx -t` is rolled back instead of being left on disk for the next
              # reload or reboot to trip over.
              for f in $NGINX_SNIPPETS; do
                if [ -f "/etc/nginx/snippets/$f" ]; then
                  sudo cp -p "/etc/nginx/snippets/$f" "/etc/nginx/snippets/$f.bak-deploy"
                else
                  sudo rm -f "/etc/nginx/snippets/$f.bak-deploy"
                fi
                sudo install -D -m 0644 "/var/www/tirvona/deploy/nginx/$f" "/etc/nginx/snippets/$f"
              done

              # The snippet only takes effect once the server block includes it.
              # That include is a one-time manual edit — this deploy cannot make
              # it safely without rewriting a config holding the TLS certificate
              # and the api.tirvona.com proxy.
              # Matches a real `include` directive anywhere under /etc/nginx, so
              # this works on both sites-enabled and conf.d layouts. Anchored on
              # the directive rather than the filename, because the snippet's own
              # header comment shows the include line and would match otherwise.
              if ! sudo grep -rEq '^[[:space:]]*include[[:space:]].*tirvona-web\.conf' /etc/nginx/; then
                echo ""
                echo "############################################################"
                echo "# WARNING: Smart Contact routing is NOT active yet."
                echo "#"
                echo "# Add this line inside the server block for www.tirvona.com"
                echo "# (usually /etc/nginx/sites-available/tirvona), then reload:"
                echo "#"
                echo "#     include /etc/nginx/snippets/tirvona-web.conf;"
                echo "#"
                echo "# Until then https://www.tirvona.com/c/{slug} keeps serving"
                echo "# the homepage instead of the identity card."
                echo "############################################################"
                echo ""
              fi

              if ! sudo grep -rEq '^[[:space:]]*include[[:space:]].*tirvona-api\.conf' /etc/nginx/; then
                echo ""
                echo "############################################################"
                echo "# WARNING: API upload limit is NOT raised yet."
                echo "#"
                echo "# Add this line inside the server block for api.tirvona.com,"
                echo "# then reload:"
                echo "#"
                echo "#     include /etc/nginx/snippets/tirvona-api.conf;"
                echo "#"
                echo "# Until then any upload over 1 MB fails with a 413 that the"
                echo "# browser reports only as 'Network Error'."
                echo "############################################################"
                echo ""
              fi

              echo "=== Validating Nginx ==="
              if ! sudo nginx -t; then
                echo "=== nginx -t failed: restoring the previous snippets (nginx keeps serving the old config) ==="
                restore_nginx
                sudo nginx -t || true
                exit 1
              fi

              echo "=== Reloading Nginx ==="
              sudo systemctl reload nginx

              # nginx -t checks syntax, not routing. If the site itself stops answering
              # after the reload, put the previous routing back.
              if ! curl -fsS -o /dev/null --retry 3 --retry-delay 2 https://www.tirvona.com/; then
                echo "=== www.tirvona.com does not answer after the reload: restoring the previous snippets ==="
                restore_nginx
                sudo nginx -t && sudo systemctl reload nginx
                exit 1
              fi
            else
              echo "INFO: Passwordless sudo is not configured for $(whoami). Skipping sudo Nginx operations."
              echo "Note: If Nginx configs were modified, run 'sudo nginx -t && sudo systemctl reload nginx' directly on the VPS."
            fi

            echo "=== Health Check ==="

            for i in $(seq 1 12); do
              if curl -fsS https://api.tirvona.com/api/health; then
                echo ""
                echo "=== API is healthy ==="
                break
              fi

              if [ "$i" -eq 12 ]; then
                echo "=== API health check failed after 12 attempts ==="
                exit 1
              fi

              echo "Health check failed. Attempt $i/12. Waiting 5 seconds..."
              sleep 5
            done

            echo "=== Server-rendered SEO Check ==="

            # The renderer puts the page's own H1 into the HTML; the static shell has
            # none. The site works either way (nginx falls back to the shell), so this
            # only warns.
            if curl -fsS https://www.tirvona.com/temples | grep -q "<h1"; then
              echo "=== Pages are server-rendered for search engines ==="
            else
              echo ""
              echo "############################################################"
              echo "# WARNING: www.tirvona.com is serving the static shell, not"
              echo "# server-rendered pages. Check the API logs for /api/seo/render"
              echo "# and that tirvona-web.conf is included (warnings above)."
              echo "############################################################"
              echo ""
            fi

            echo "=== Smart Contact Routing Check ==="

            # The two builds emit to different asset directories precisely so
            # they can be told apart: /sc-assets is the identity card, /assets
            # is the marketing SPA. Any slug works here — a profile that does
            # not exist still renders from the Smart Contact bundle.
            if curl -fsS https://www.tirvona.com/c/_deploy_check | grep -q "/sc-assets/"; then
              echo "=== /c/{slug} correctly serves the Smart Contact page ==="
            else
              echo ""
              echo "############################################################"
              echo "# WARNING: /c/{slug} is serving the main SPA, not the"
              echo "# Smart Contact page. Scanned QR codes will show the"
              echo "# homepage. See the Nginx routing warning above."
              echo "############################################################"
              echo ""
            fi

            echo "=== Upload Size Limit Check ==="

            # A 2 MB body with no credentials. Past nginx it reaches the app and
            # is refused as 401; stopped by nginx it is a 413. So the status code
            # alone says whether the body cap is raised, without uploading
            # anything or needing a token.
            head -c 2000000 /dev/urandom > /tmp/tirvona-size-probe.bin
            PROBE=$(curl -sS -o /dev/null -w "%{http_code}" \
              -X POST https://api.tirvona.com/api/uploads \
              -F "file=@/tmp/tirvona-size-probe.bin" || echo "000")
            rm -f /tmp/tirvona-size-probe.bin

            if [ "$PROBE" = "413" ]; then
              echo ""
              echo "############################################################"
              echo "# WARNING: nginx is still capping request bodies at 1 MB."
              echo "# Image uploads will keep failing. See the API warning above."
              echo "############################################################"
              echo ""
            else
              echo "=== Uploads over 1 MB reach the API (probe returned $PROBE) ==="
            fi

            echo "=== Canonical WWW 301 Redirect Check ==="
            NONWWW_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" https://tirvona.com/ || echo "000")
            NONWWW_LOC=$(curl -sS -I https://tirvona.com/ | grep -i '^location:' | tr -d '\r\n' || echo "")
            if [ "$NONWWW_STATUS" = "301" ] && echo "$NONWWW_LOC" | grep -q "https://www.tirvona.com/"; then
              echo "=== Canonical 301 redirect is ACTIVE (Status: $NONWWW_STATUS, $NONWWW_LOC) ==="
            else
              echo ""
              echo "############################################################"
              echo "# WARNING: Non-WWW redirect is NOT active yet."
              echo "# Observed status: $NONWWW_STATUS ($NONWWW_LOC)"
              echo "#"
              echo "# Ensure include /etc/nginx/snippets/tirvona-web.conf;"
              echo "# is inside the server block for tirvona.com / www.tirvona.com,"
              echo "# then run: sudo nginx -t && sudo systemctl reload nginx"
              echo "############################################################"
              echo ""
            fi

            echo "================================"
            echo "Tirvona deployment successful"
            echo "================================"
