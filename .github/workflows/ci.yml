name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Fails the build if any schema.index() names a field that does not exist
      # on its schema — the mistake that left a dead { isVerified, status }
      # index on Ashram. Runs fully offline: no database, no secrets.
      - name: Validate index field paths
        working-directory: backend
        run: npm run check:indexes

      # Catches syntax errors without needing to boot the server (which would
      # require MONGODB_URI and JWT_SECRET).
      - name: Syntax check
        working-directory: backend
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
